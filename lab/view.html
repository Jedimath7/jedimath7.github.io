<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Материал — Математическая лаборатория</title><link rel="stylesheet" href="lab.css"></head><body class="viewer"><div class="wrap"><header class="header"><a class="brand" href="index.html">Лаборатория</a><span class="viewer-title" id="title"></span><div class="viewer-tools"><a id="back" href="index.html">В каталог</a><a id="standalone" hidden target="_blank" rel="noopener">Отдельно</a><button class="viewer-button" id="fullscreen" type="button" hidden>На весь экран</button></div></header></div><div id="error" class="viewer-error" hidden><h1>Материал не найден</h1><p>Выберите модель в <a href="index.html">каталоге лаборатории</a>.</p></div><iframe id="frame" title="Интерактивный математический материал" hidden allow="fullscreen"></iframe><script src="lab-data.js"></script><script>
'use strict';const key=new URLSearchParams(location.search).get('item');const item=Object.hasOwn(LAB_ITEMS,key)?LAB_ITEMS[key]:null;if(item){document.title=item.title+' — Лаборатория';document.getElementById('title').textContent=item.title;const frame=document.getElementById('frame');frame.title=item.title;frame.src=item.path;frame.hidden=false;const back=document.getElementById('back');back.href=item.group+'/index.html';const link=document.getElementById('standalone');link.href=item.path;link.hidden=false;const btn=document.getElementById('fullscreen');if(document.fullscreenEnabled){btn.hidden=false;btn.onclick=()=>frame.requestFullscreen().catch(()=>{btn.textContent='Открыть отдельно';btn.onclick=()=>link.click();});}}else document.getElementById('error').hidden=false;
</script></body></html>
