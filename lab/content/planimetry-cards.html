<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Карточки · Задание 1 (планиметрия)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe9dc;        /* фон страницы */
    --paper2:#e7e0cf;
    --card:#fbf8f1;         /* лицо карточки */
    --ink:#322e28;          /* основной цвет линий и текста */
    --muted:#8d8475;        /* приглушённый текст */
    --accent:#bf5a2e;       /* терракотовый акцент */
    --accent-soft:#f0d9c9;
    --good:#5d8a55;         /* "знаю" */
    --line:#d9d0bf;
    --shadow:rgba(60,50,35,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,var(--paper) 0%,var(--paper2) 100%);
    color:var(--ink);
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:18px 14px 40px;
    -webkit-tap-highlight-color:transparent;
  }

  header{text-align:center;margin-bottom:14px}
  header h1{font-family:'Prata',Georgia,serif;font-weight:400;font-size:clamp(22px,5vw,32px);letter-spacing:.3px}
  header p{color:var(--muted);font-size:13px;margin-top:4px}

  /* панель управления */
  .panel{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .chip{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:500 12.5px/1 'Inter',sans-serif;padding:7px 11px;border-radius:999px;cursor:pointer;
    transition:.15s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--accent)}
  .chip.active{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .chip .n{opacity:.55;margin-left:4px;font-size:11px}

  .tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
  .tbtn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:600 13px 'Inter',sans-serif;padding:9px 14px;border-radius:10px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.15s;
  }
  .tbtn:hover{border-color:var(--accent);color:var(--accent)}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

  /* карточка */
  .scene{width:100%;max-width:520px;perspective:1400px;margin:0 auto}
  .card{
    position:relative;width:100%;min-height:62vh;max-height:560px;height:480px;
    transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.1,.2,1);cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:0 14px 34px -12px var(--shadow),0 2px 0 rgba(255,255,255,.6) inset;
    display:flex;flex-direction:column;padding:22px 22px 18px;overflow:hidden;
  }
  .face::before{ /* тонкая рамка-инкрустация */
    content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:15px;pointer-events:none;opacity:.7;
  }
  .back{transform:rotateY(180deg)}

  .cat{font:600 11px/1 'Inter';letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);z-index:1}
  .knownmark{position:absolute;top:18px;right:20px;color:var(--good);font-size:13px;font-weight:700;display:none;align-items:center;gap:5px;z-index:2}
  .knownmark.show{display:flex}
  .knownmark svg{width:16px;height:16px;stroke:var(--good);fill:none;stroke-width:2.5}

  .fig{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;z-index:1;margin:6px 0}
  .fig svg{width:100%;height:100%;max-height:300px;color:var(--ink);overflow:visible}
  .fig svg :is(line,polygon,circle,rect,path,polyline){fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
  .fig svg .m{stroke:var(--accent);stroke-width:2.3}
  .fig svg .m2{stroke:var(--accent);stroke-width:3.2}
  .fig svg .d{fill:var(--accent);stroke:none}
  .fig svg text{fill:currentColor;stroke:none;font:italic 15px Georgia,serif}
  .fig svg .lt{font-style:normal;font-size:13px}

  .title{font-family:'Prata',Georgia,serif;font-size:clamp(18px,4.5vw,23px);text-align:center;line-height:1.25;z-index:1}
  .hint{text-align:center;color:var(--muted);font-size:11.5px;margin-top:8px;z-index:1}

  /* оборот — формула */
  .back .fig{flex:0 0 auto;max-height:160px;margin-top:4px}
  .back .fig svg{max-height:150px;opacity:.85}
  .answer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-size:clamp(19px,5vw,26px);line-height:1.45;z-index:1;gap:6px}
  .answer b{color:var(--accent);font-weight:700}
  .answer .note{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:4px;line-height:1.4}
  .answer .sm{font-size:.8em}

  /* дроби и корни */
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .18em;font-size:.92em}
  .frac .num{border-bottom:1.7px solid currentColor;padding:0 .4em 1px}
  .frac .den{padding:2px .4em 0}
  .rad{border-top:1.6px solid currentColor;padding:0 1px}
  sub{font-size:.7em}

  /* нижние кнопки */
  .controls{width:100%;max-width:520px;display:flex;gap:10px;margin:16px auto 0;align-items:stretch}
  .nav{flex:0 0 auto;width:54px;border:1px solid var(--line);background:var(--card);border-radius:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--ink)}
  .nav:hover{border-color:var(--accent);color:var(--accent)}
  .nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2}
  .know{flex:1;border:none;border-radius:14px;cursor:pointer;font:700 15px 'Inter';color:#fff;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .know.no{background:#b9b0a0}
  .know.no:hover{background:#a89e8c}
  .know.yes{background:var(--good)}
  .know.yes:hover{filter:brightness(1.06)}
  .know svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4}

  .counter{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
  .counter b{color:var(--ink)}
  .progress{width:100%;max-width:520px;height:6px;background:var(--paper2);border:1px solid var(--line);border-radius:999px;margin:8px auto 0;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}

  .kbd{margin-top:18px;color:var(--muted);font-size:11.5px;text-align:center}
  .kbd kbd{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit;font-size:11px}

  /* список */
  .listview{display:none;width:100%;max-width:1000px;margin-top:6px}
  .listview.show{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 16px -10px var(--shadow)}
  .lcard .cat{font-size:10px}
  .lcard .lfig{height:120px;display:flex;align-items:center;justify-content:center;margin:6px 0}
  .lcard .lfig svg{max-height:118px;color:var(--ink);overflow:visible}
  .lcard .lfig svg :is(line,polygon,circle,rect,path,polyline){fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
  .lcard .lfig svg .m{stroke:var(--accent);stroke-width:2.3}
  .lcard .lfig svg .m2{stroke:var(--accent);stroke-width:3.2}
  .lcard .lfig svg .d{fill:var(--accent);stroke:none}
  .lcard .lfig svg text{fill:currentColor;stroke:none;font:italic 14px Georgia,serif}
  .lcard .lfig svg .lt{font-style:normal;font-size:12px}
  .lcard .ltitle{font-family:'Prata',serif;font-size:15px;text-align:center;margin-bottom:6px}
  .lcard .lans{text-align:center;font-size:16px;line-height:1.4;border-top:1px solid var(--line);padding-top:8px}
  .lcard .lans b{color:var(--accent)}
  .lcard .lans .note{display:block;font-size:11px;color:var(--muted);margin-top:3px}

  @media(max-width:480px){
    .card{height:auto;min-height:66vh}
    .controls{max-width:520px}
  }
</style>
</head>
<body>
<header>
  <h1>Планиметрия · Задание 1</h1>
  <p>Карточки для запоминания формул и теорем</p>
</header>

<div class="panel">
  <div class="chips" id="chips"></div>
  <div class="tools">
    <button class="tbtn" id="shuffleBtn"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Перемешать</button>
    <button class="tbtn" id="unknownBtn"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>Только «не знаю»</button>
    <button class="tbtn" id="resetBtn"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Сбросить</button>
    <button class="tbtn" id="viewBtn"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Список</button>
  </div>
</div>

<div class="scene" id="scene">
  <div class="card" id="card">
    <div class="face front">
      <span class="cat" id="fCat"></span>
      <span class="knownmark" id="fMark"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>знаю</span>
      <div class="fig" id="fFig"></div>
      <div class="title" id="fTitle"></div>
      <div class="hint">нажми, чтобы увидеть формулу ↻</div>
    </div>
    <div class="face back">
      <span class="cat" id="bCat"></span>
      <div class="fig" id="bFig"></div>
      <div class="answer" id="bAns"></div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="nav" id="prevBtn" title="Назад"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
  <button class="know no" id="noBtn"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>Не знаю</button>
  <button class="know yes" id="yesBtn"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Знаю</button>
  <button class="nav" id="nextBtn" title="Вперёд"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
</div>

<div class="progress"><i id="progBar"></i></div>
<div class="counter" id="counter"></div>
<div class="kbd">Клавиши: <kbd>←</kbd> <kbd>→</kbd> листать · <kbd>пробел</kbd> перевернуть · <kbd>З</kbd> знаю · <kbd>Н</kbd> не знаю</div>

<div class="listview" id="listview"></div>

<script>
/* ===== вспомогательные функции для формул ===== */
const fr=(n,d)=>`<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const rt=(x)=>`&#8730;<span class="rad">${x}</span>`; // корень

/* ===== геометрия чертежей: аккуратные отметки на углах ===== */
const _r=n=>Math.round(n*100)/100;                       // округление координат
const _u=(dx,dy)=>{const L=Math.hypot(dx,dy)||1;return[dx/L,dy/L];}; // единичный вектор
// дуга-отметка угла: вершина (vx,vy); стороны идут к точкам A и B; r — радиус, cls — класс
function ang(vx,vy,ax,ay,bx,by,r=16,cls='m'){
  const a1=Math.atan2(ay-vy,ax-vx), a2=Math.atan2(by-vy,bx-vx);
  let d=a2-a1; while(d<=-Math.PI)d+=2*Math.PI; while(d>Math.PI)d-=2*Math.PI;
  const sw=d>0?1:0;                                       // направление обхода — внутрь угла
  const x1=_r(vx+r*Math.cos(a1)), y1=_r(vy+r*Math.sin(a1));
  const x2=_r(vx+r*Math.cos(a2)), y2=_r(vy+r*Math.sin(a2));
  return `<path class="${cls}" d="M${x1} ${y1} A${r} ${r} 0 0 ${sw} ${x2} ${y2}"/>`;
}
// значок прямого угла (квадратик): вершина V; стороны к A и B; s — размер
function rang(vx,vy,ax,ay,bx,by,s=12){
  const[u1x,u1y]=_u(ax-vx,ay-vy),[u2x,u2y]=_u(bx-vx,by-vy);
  const p1=`${_r(vx+u1x*s)} ${_r(vy+u1y*s)}`;
  const p2=`${_r(vx+u1x*s+u2x*s)} ${_r(vy+u1y*s+u2y*s)}`;
  const p3=`${_r(vx+u2x*s)} ${_r(vy+u2y*s)}`;
  return `<polyline points="${p1} ${p2} ${p3}"/>`;
}
// засечки равных сторон на отрезке P→Q: t — доля длины (где ставить), n — число штрихов, len — длина штриха
function tick(px,py,qx,qy,t=0.5,n=1,len=7){
  const[ux,uy]=_u(qx-px,qy-py);                           // вдоль отрезка
  const nx=-uy, ny=ux;                                    // перпендикуляр
  const mx=px+(qx-px)*t, my=py+(qy-py)*t;                 // точка установки
  let s=''; const gap=4, start=-(n-1)/2;
  for(let i=0;i<n;i++){
    const off=(start+i)*gap, cx=mx+ux*off, cy=my+uy*off;
    s+=`<line class="m" x1="${_r(cx-nx*len/2)}" y1="${_r(cy-ny*len/2)}" x2="${_r(cx+nx*len/2)}" y2="${_r(cy+ny*len/2)}"/>`;
  }
  return s;
}

/* ===== данные: 54 карточки ===== */
const CARDS=[
/* --- УГЛЫ --- */
{c:'Углы',t:'Смежные углы',
 f:`<svg viewBox="0 0 200 120"><line x1="12" y1="90" x2="188" y2="90"/><line x1="96" y1="90" x2="152" y2="26"/>${ang(96,90,188,90,152,26,16)}${ang(96,90,12,90,152,26,16)}</svg>`,
 a:`В сумме <b>180°</b>`},
{c:'Углы',t:'Вертикальные углы',
 f:`<svg viewBox="0 0 200 130"><line x1="18" y1="38" x2="182" y2="98"/><line x1="36" y1="112" x2="164" y2="24"/>${ang(100,68,18,38,36,112,18)}${ang(100,68,182,98,164,24,18)}</svg>`,
 a:`<b>Равны</b> между собой`},
{c:'Углы',t:'Накрест лежащие углы',
 f:`<svg viewBox="0 0 200 140"><line x1="15" y1="50" x2="185" y2="50"/><line x1="15" y1="102" x2="185" y2="102"/><line x1="55" y1="22" x2="150" y2="128"/>${ang(80,50,185,50,150,128,15)}${ang(126.7,102,15,102,55,22,15)}</svg>`,
 a:`Если равны — прямые <b>параллельны</b><span class="note">признак параллельности прямых</span>`},
{c:'Углы',t:'Соответственные углы',
 f:`<svg viewBox="0 0 200 140"><line x1="15" y1="50" x2="185" y2="50"/><line x1="15" y1="102" x2="185" y2="102"/><line x1="55" y1="22" x2="150" y2="128"/>${ang(80,50,185,50,150,128,15)}${ang(126.7,102,185,102,150,128,15)}</svg>`,
 a:`Если равны — прямые <b>параллельны</b><span class="note">признак параллельности прямых</span>`},
{c:'Углы',t:'Односторонние углы',
 f:`<svg viewBox="0 0 200 140"><line x1="15" y1="50" x2="185" y2="50"/><line x1="15" y1="102" x2="185" y2="102"/><line x1="55" y1="22" x2="150" y2="128"/>${ang(80,50,185,50,150,128,15)}${ang(126.7,102,185,102,55,22,15)}</svg>`,
 a:`Если сумма = <b>180°</b> — прямые <b>параллельны</b>`},
{c:'Углы',t:'Сумма углов треугольника',
 f:`<svg viewBox="0 0 200 130"><polygon points="20,112 180,112 75,22"/>${ang(20,112,180,112,75,22,16)}${ang(180,112,20,112,75,22,16)}${ang(75,22,20,112,180,112,16)}</svg>`,
 a:`<b>180°</b>`},
{c:'Углы',t:'Сумма углов четырёхугольника',
 f:`<svg viewBox="0 0 200 135"><polygon points="28,32 168,22 184,110 42,122"/>${ang(28,32,42,122,168,22,15)}${ang(168,22,28,32,184,110,15)}${ang(184,110,168,22,42,122,15)}${ang(42,122,184,110,28,32,15)}</svg>`,
 a:`<b>360°</b>`},
{c:'Углы',t:'Сумма углов многоугольника',
 f:`<svg viewBox="0 0 200 150"><polygon points="100,16 174,68 146,150 54,150 26,68"/></svg>`,
 a:`<b>180° · (n − 2)</b><span class="note">пятиугольник — 540°, шестиугольник — 720°</span>`},

/* --- ТРЕУГОЛЬНИК --- */
{c:'Треугольник',t:'Площадь — через сторону и высоту',
 f:`<svg viewBox="0 0 200 138"><polygon points="20,115 180,115 82,28"/><line x1="82" y1="28" x2="82" y2="115"/><polyline points="82,115 82,106 91,106"/><text x="96" y="132">a</text><text x="88" y="78">h<tspan dy="3" font-size="11">a</tspan></text></svg>`,
 a:`S = ${fr('1','2')}·a·h<sub>a</sub>`},
{c:'Треугольник',t:'Площадь — через две стороны и угол',
 f:`<svg viewBox="0 0 200 138"><polygon points="20,118 178,118 80,22"/>${ang(80,22,20,118,178,118,18)}<text x="86" y="42">α</text><text x="40" y="72">a</text><text x="132" y="68">c</text></svg>`,
 a:`S = ${fr('1','2')}·a·c·sin&#8201;α`},
{c:'Треугольник',t:'Площадь — через вписанную окружность',
 f:`<svg viewBox="0 0 200 140"><polygon points="20,120 182,120 96,20"/><circle cx="96" cy="92" r="27"/><line x1="96" y1="92" x2="96" y2="120"/><text x="100" y="112">r</text></svg>`,
 a:`S = p · r<span class="note">p — полупериметр</span>`},
{c:'Треугольник',t:'Площадь — через описанную окружность',
 f:`<svg viewBox="0 0 200 150"><circle cx="100" cy="78" r="58"/><polygon points="100,20 50,114 158,104"/><line x1="100" y1="78" x2="100" y2="20"/><text x="104" y="52">R</text><text x="66" y="72">a</text><text x="136" y="64">b</text><text x="98" y="128">c</text></svg>`,
 a:`S = ${fr('a·b·c','4R')}`},
{c:'Треугольник',t:'Теорема синусов',
 f:`<svg viewBox="0 0 200 150"><circle cx="100" cy="76" r="58"/><polygon points="96,18 48,108 158,98"/><text x="60" y="72">a</text><text x="134" y="60">b</text><text x="98" y="124">c</text><text x="84" y="36" class="lt">γ</text><text x="56" y="96" class="lt">β</text><text x="138" y="90" class="lt">α</text></svg>`,
 a:`${fr('a','sin α')} = ${fr('b','sin β')} = ${fr('c','sin γ')} = 2R`},
{c:'Треугольник',t:'Средняя линия треугольника',
 f:`<svg viewBox="0 0 200 135"><polygon points="20,118 180,118 90,22"/><line class="m2" x1="55" y1="70" x2="135" y2="70"/><text x="42" y="68">M</text><text x="140" y="68">N</text><line x1="35" y1="98" x2="42" y2="92"/><line x1="143" y1="92" x2="150" y2="98"/></svg>`,
 a:`<span class="note" style="font-size:.92em;color:var(--ink)">• лежит на серединах сторон<br>• параллельна основанию<br>• равна <b>половине</b> основания</span>`},

/* ===== логика ===== */
const cats=[...new Set(CARDS.map(c=>c.c))];
let activeCat='Все', deck=[], pos=0, onlyUnknown=false;
const known=JSON.parse(localStorage.getItem('g1_known')||'{}');
const saveKnown=()=>localStorage.setItem('g1_known',JSON.stringify(known));

const $=id=>document.getElementById(id);

/* чипы тем */
function buildChips(){
  const wrap=$('chips'); wrap.innerHTML='';
  const mk=(label,val,count)=>{
    const b=document.createElement('button');
    b.className='chip'+(activeCat===val?' active':'');
    b.innerHTML=label+`<span class="n">${count}</span>`;
    b.onclick=()=>{activeCat=val;applyFilters();buildChips();};
    wrap.appendChild(b);
  };
  mk('Все','Все',CARDS.length);
  cats.forEach(c=>mk(c,c,CARDS.filter(x=>x.c===c).length));
}

function applyFilters(){
  deck=CARDS.map((_,i)=>i)
    .filter(i=>activeCat==='Все'||CARDS[i].c===activeCat)
    .filter(i=>!onlyUnknown||!known[CARDS[i].t]);
  if(deck.length===0)deck=[0]; // на случай пустого
  pos=0; show();
}
function shuffle(){
  for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]];}
  pos=0; show();
}

function show(){
  const card=$('card'); card.classList.remove('flipped');
  const i=deck[pos], c=CARDS[i];
  $('fCat').textContent=c.c; $('bCat').textContent=c.c;
  $('fTitle').textContent=c.t;
  $('fFig').innerHTML=c.f; $('bFig').innerHTML=c.f;
  $('bAns').innerHTML=c.a;
  $('fMark').classList.toggle('show',!!known[c.t]);
  const total=CARDS.length, learned=Object.keys(known).filter(k=>known[k]).length;
  $('counter').innerHTML=`Карточка <b>${pos+1}</b> из <b>${deck.length}</b> &nbsp;·&nbsp; изучено <b>${learned}</b> из ${total}`;
  $('progBar').style.width=(learned/total*100)+'%';
}

function flip(){$('card').classList.toggle('flipped');}
function next(){pos=(pos+1)%deck.length;show();}
function prev(){pos=(pos-1+deck.length)%deck.length;show();}
function setKnown(v){
  const t=CARDS[deck[pos]].t;
  if(v)known[t]=true; else delete known[t];
  saveKnown();
  if(onlyUnknown&&v){applyFilters();} else {next();}
}

/* кнопки */
$('card').onclick=flip;
$('prevBtn').onclick=e=>{e.stopPropagation();prev();};
$('nextBtn').onclick=e=>{e.stopPropagation();next();};
$('noBtn').onclick=()=>setKnown(false);
$('yesBtn').onclick=()=>setKnown(true);
$('shuffleBtn').onclick=shuffle;
$('unknownBtn').onclick=function(){onlyUnknown=!onlyUnknown;this.classList.toggle('on',onlyUnknown);applyFilters();};
$('resetBtn').onclick=()=>{if(confirm('Сбросить все отметки «знаю»?')){for(const k in known)delete known[k];saveKnown();applyFilters();}};

/* список */
let listOpen=false;
$('viewBtn').onclick=function(){
  listOpen=!listOpen;
  $('listview').classList.toggle('show',listOpen);
  $('scene').style.display=listOpen?'none':'';
  document.querySelector('.controls').style.display=listOpen?'none':'';
  $('counter').style.display=listOpen?'none':'';
  document.querySelector('.progress').style.display=listOpen?'none':'';
  document.querySelector('.kbd').style.display=listOpen?'none':'';
  this.classList.toggle('on',listOpen);
  this.lastChild.textContent=listOpen?' Карточки':' Список';
  if(listOpen)buildList();
};
function buildList(){
  const lv=$('listview'); lv.innerHTML='';
  const items=CARDS.filter(c=>activeCat==='Все'||c.c===activeCat);
  items.forEach(c=>{
    const d=document.createElement('div'); d.className='lcard';
    d.innerHTML=`<span class="cat">${c.c}</span><div class="lfig">${c.f}</div>`+
      `<div class="ltitle">${c.t}</div><div class="lans">${c.a}</div>`;
    lv.appendChild(d);
  });
}

/* клавиатура */
document.addEventListener('keydown',e=>{
  if(listOpen)return;
  if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
  else if(e.key===' '){e.preventDefault();flip();}
  else if(e.key==='з'||e.key==='З'||e.key==='z')setKnown(true);
  else if(e.key==='н'||e.key==='Н'||e.key==='n')setKnown(false);
});

/* старт */
buildChips();
applyFilters();
</script>
</body>
</html>
