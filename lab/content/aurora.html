<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Северное сияние • Aurora</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: 'Georgia', serif;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }

  #ui {
    position: fixed;
    bottom: 36px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 14px;
    pointer-events: none;
    z-index: 2;
  }
  #ui button {
    pointer-events: all;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.04em;
    transition: all 0.4s;
    backdrop-filter: blur(6px);
  }
  #ui button:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.35);
    color: #fff;
    box-shadow: 0 0 24px rgba(180,200,255,0.25);
  }
  #ui button.active {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.5);
    color: #fff;
    box-shadow: 0 0 30px rgba(180,200,255,0.4);
  }

  #stats {
    position: fixed;
    top: 24px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 13px;
    letter-spacing: 0.08em;
    pointer-events: none;
    transition: opacity 1.5s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats">звёзд: <span id="starCount">0</span> &nbsp;•&nbsp; потоков: <span id="streamCount">0</span> &nbsp;•&nbsp; fps: <span id="fps">0</span></div>
<div id="ui">
  <button id="btnMode" onclick="cycleMode()">режим</button>
  <button onclick="addBurst()">вспышка</button>
  <button id="btnPause" onclick="togglePause()">пауза</button>
  <button onclick="location.reload()">сброс</button>
</div>

<script>
// ═══════════════════════════════════════════════
//  Aurora — генеративное северное сияние
//  Алгоритм: particles + noise field + flow ribbons
// ═══════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Состояние ───
const state = {
  mode: 0,       // 0–3 индекс палитры
  paused: false,
  time: 0,
};

const PALETTES = [
  // Aurora — зелёно-фиолетовое сияние
  { name: 'aurora', bg: [2,3,8], hues: [[140,170], [260,300], [180,210]], sat: [60,90], light: [45,75] },
  // Fire — оранжево-красное
  { name: 'огонь', bg: [3,2,1], hues: [[0,30], [15,45], [340,360]], sat: [75,100], light: [40,70] },
  // Deep ocean — сине-бирюзовое
  { name: 'океан', bg: [1,2,4], hues: [[190,220], [160,190], [210,240]], sat: [60,95], light: [35,65] },
  // Rose gold — розово-золотое
  { name: 'розовое золото', bg: [3,2,2], hues: [[330,360], [20,40], [300,330]], sat: [50,85], light: [50,80] },
];

// ─── Мышь ───
const mouse = {
  x: W/2, y: H/2,
  px: W/2, py: H/2,
  down: false,
  vx: 0, vy: 0,
  trail: [],      // история позиций для рисования ленты
};
const MAX_TRAIL = 60;

window.addEventListener('mousemove', e => {
  mouse.px = mouse.x;
  mouse.py = mouse.y;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.vx = mouse.x - mouse.px;
  mouse.vy = mouse.y - mouse.py;
  if (mouse.down) {
    mouse.trail.push({x: mouse.x, y: mouse.y, t: state.time});
    if (mouse.trail.length > MAX_TRAIL) mouse.trail.shift();
  }
});
window.addEventListener('mousedown', () => { mouse.down = true; mouse.trail = [{x: mouse.x, y: mouse.y, t: state.time}]; });
window.addEventListener('mouseup',   () => { mouse.down = false; });

// Touch
window.addEventListener('touchmove', e => {
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
  mouse.vx = mouse.x - mouse.px; mouse.vy = mouse.y - mouse.py;
  if (mouse.down) {
    mouse.trail.push({x: mouse.x, y: mouse.y, t: state.time});
    if (mouse.trail.length > MAX_TRAIL) mouse.trail.shift();
  }
}, {passive: true});
window.addEventListener('touchstart', e => {
  mouse.down = true;
  mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
  mouse.trail = [{x: mouse.x, y: mouse.y, t: state.time}];
});
window.addEventListener('touchend', () => { mouse.down = false; });

// ─── Частицы ───
class StreamParticle {
  constructor(burst = false) {
    this.reset(burst);
  }
  reset(burst = false) {
    if (burst) {
      // От центра экрана — взрыв
      const cx = W/2, cy = H/2;
      const a = Math.random() * Math.PI * 2;
      const r = 80 + Math.random() * 250;
      this.x = cx + Math.cos(a) * r;
      this.y = cy + Math.sin(a) * r;
      const speed = 2 + Math.random() * 6;
      this.vx = Math.cos(a + Math.PI) * speed * (0.3 + Math.random() * 0.7);
      this.vy = Math.sin(a + Math.PI) * speed * (0.3 + Math.random() * 0.7);
    } else {
      this.x = Math.random() * W;
      this.y = -10 - Math.random() * H * 0.3;
      this.vx = (Math.random() - 0.5) * 0.6;
      this.vy = 0.3 + Math.random() * 1.2;
    }
    this.life  = 0.6 + Math.random() * 0.4;
    this.size  = 1.2 + Math.random() * 2.5;
    this.decay = 0.0004 + Math.random() * 0.0012;
    this.noiseSeed = Math.random() * 999;
    this.hueOffset = Math.random() * 30 - 15;
    this.sparkle = Math.random() < 0.15; // 15% частиц мерцают
  }
  update(flowField, pal) {
    // Силовое поле: шум + течение
    const fx = Math.floor(this.x / flowField.cellSize);
    const fy = Math.floor(this.y / flowField.cellSize);
    const idx = (fy * flowField.cols + Math.min(fx, flowField.cols-1)) * 2;
    const ffx = flowField.data[idx] || 0;
    const ffy = flowField.data[idx+1] || 0;

    // Притяжение к мыши если зажата
    let attractX = 0, attractY = 0;
    if (mouse.down) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx*dx + dy*dy) + 0.1;
      const force = 0.6 / (dist * 0.008 + 1);
      attractX = dx / dist * force * 0.4;
      attractY = dy / dist * force * 0.4;
    }

    // Турбулентность
    const t = state.time * 0.0003;
    const nx = Math.sin(this.y * 0.006 + t + this.noiseSeed) * 0.025;
    const ny = Math.cos(this.x * 0.005 + t * 1.3 + this.noiseSeed) * 0.025;

    this.vx += ffx * 0.03 + nx + attractX;
    this.vy += ffy * 0.03 + ny + attractY;

    // Воздушное сопротивление
    this.vx *= 0.997;
    this.vy *= 0.997;

    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;

    // Цикличность по X
    const margin = 40;
    if (this.x < -margin) this.x += W + margin*2;
    if (this.x > W + margin) this.x -= W + margin*2;

    if (this.y > H + margin) { this.y = -margin; this.x = Math.random() * W; }
    if (this.y < -margin - 80) this.y = H + margin;
  }
  draw(ctx, pal, alpha = 1) {
    const a = this.life * alpha;
    if (a < 0.01) return;
    const palHues = pal.hues[Math.floor(Math.random() * pal.hues.length)];
    const h = (palHues[0] + Math.random() * (palHues[1] - palHues[0]) + this.hueOffset + 360) % 360;
    const s = pal.sat[0] + Math.random() * (pal.sat[1] - pal.sat[0]);
    const l = pal.light[0] + Math.random() * (pal.light[1] - pal.light[0]);

    // Свечение
    if (this.sparkle && Math.sin(state.time * 0.01 + this.noiseSeed * 10) > 0.7) {
      // Мерцание — ярче
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 6);
      g.addColorStop(0, `hsla(${h}, ${s}%, ${l+20}%, ${a*1.3})`);
      g.addColorStop(0.3, `hsla(${h}, ${s}%, ${l}%, ${a*0.6})`);
      g.addColorStop(1, `hsla(${h}, ${s}%, ${l-20}%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 6, 0, Math.PI*2);
      ctx.fill();
    } else {
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3.5);
      g.addColorStop(0, `hsla(${h}, ${s}%, ${l+10}%, ${a})`);
      g.addColorStop(0.5, `hsla(${h}, ${s}%, ${l}%, ${a*0.4})`);
      g.addColorStop(1, `hsla(${h}, ${s}%, ${l-15}%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size * 3.5, 0, Math.PI*2);
      ctx.fill();
    }
  }
  get dead() { return this.life <= 0; }
}

// ─── Flow Field ───
class FlowField {
  constructor() {
    this.cellSize = 35;
    this.recalc();
  }
  recalc() {
    this.cols = Math.ceil(W / this.cellSize) + 1;
    this.rows = Math.ceil(H / this.cellSize) + 1;
    this.data = new Float32Array(this.cols * this.rows * 2);
  }
  update(t) {
    for (let y = 0; y < this.rows; y++) {
      for (let x = 0; x < this.cols; x++) {
        const i = (y * this.cols + x) * 2;
        const px = x * this.cellSize;
        const py = y * this.cellSize;
        // Поле течёт в основном вниз с синусоидальными волнами
        const wave1 = Math.sin(px * 0.004 + t * 0.0008) * Math.cos(py * 0.003 + t * 0.0006) * 2.5;
        const wave2 = Math.cos(px * 0.0035 + t * 0.0005) * Math.sin(py * 0.0045 - t * 0.0007) * 1.8;
        const wave3 = Math.sin((px + py) * 0.003 + t * 0.0004) * 1.2;
        this.data[i]   = wave1;              // vx
        this.data[i+1] = 0.6 + wave2 + wave3; // vy (базовое течение вниз)
      }
    }
  }
}

// ─── Звёзды (фон) ───
class Star {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.baseBrightness = 0.15 + Math.random() * 0.85;
    this.twinkleSpeed = 0.003 + Math.random() * 0.02;
    this.twinklePhase = Math.random() * Math.PI * 2;
    this.size = 0.3 + Math.random() * 0.9;
  }
  draw(ctx, t) {
    const b = this.baseBrightness * (0.55 + 0.45 * Math.sin(t * this.twinkleSpeed + this.twinklePhase));
    ctx.fillStyle = `rgba(255,255,255,${b})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
  }
  resetX() { this.x = Math.random() * W; }
  resetY() { this.y = Math.random() * H; }
}

// ─── Инициализация ───
const NUM_STREAMS = 220;
const NUM_STARS  = 280;
const streams = [];
const stars   = [];
const flowField = new FlowField();
let ribbonCanvas, ribbonCtx; // отдельный холст для лент

function initRibbon() {
  ribbonCanvas = document.createElement('canvas');
  ribbonCanvas.width = W; ribbonCanvas.height = H;
  ribbonCtx = ribbonCanvas.getContext('2d');
}
initRibbon();
window.addEventListener('resize', () => {
  flowField.recalc();
  initRibbon();
  for (const s of stars) { s.resetX(); s.resetY(); }
});

for (let i = 0; i < NUM_STREAMS; i++) streams.push(new StreamParticle());
for (let i = 0; i < NUM_STARS; i++)  stars.push(new Star());

// ─── Отрисовка ───
let lastFrameTime = performance.now();
let frameCount = 0;
let lastFpsUpdate = 0;
let currentFps = 0;

function drawRibbon() {
  if (mouse.trail.length < 2) return;
  const pal = PALETTES[state.mode];

  ribbonCtx.clearRect(0, 0, W, H);

  // Рисуем плавную кривую по следу мыши
  for (let i = 1; i < mouse.trail.length; i++) {
    const p0 = mouse.trail[i-1];
    const p1 = mouse.trail[i];
    const alpha = 1 - (state.time - p1.t) * 0.003; // затухание со временем
    if (alpha <= 0) continue;

    const segments = 8;
    for (let s = 0; s < segments; s++) {
      const t0 = s / segments;
      const t1 = (s+1) / segments;
      const x0 = p0.x + (p1.x - p0.x) * t0;
      const y0 = p0.y + (p1.y - p0.y) * t0;
      const x1 = p0.x + (p1.x - p0.x) * t1;
      const y1 = p0.y + (p1.y - p0.y) * t1;

      const width = 14 * alpha;
      const hueIdx = Math.floor((i + s) / 4) % pal.hues.length;
      const [hMin, hMax] = pal.hues[hueIdx];
      const h = hMin + ((i*7 + s*3) % (hMax - hMin));

      ribbonCtx.strokeStyle = `hsla(${h}, 80%, 65%, ${alpha * 0.5})`;
      ribbonCtx.lineWidth = width;
      ribbonCtx.lineCap = 'round';
      ribbonCtx.beginPath();
      ribbonCtx.moveTo(x0, y0);
      ribbonCtx.lineTo(x1, y1);
      ribbonCtx.stroke();

      // Тонкая яркая сердцевина
      ribbonCtx.strokeStyle = `hsla(${h}, 60%, 85%, ${alpha * 0.8})`;
      ribbonCtx.lineWidth = width * 0.25;
      ribbonCtx.beginPath();
      ribbonCtx.moveTo(x0, y0);
      ribbonCtx.lineTo(x1, y1);
      ribbonCtx.stroke();
    }
  }

  // Очищаем старые точки
  mouse.trail = mouse.trail.filter(p => state.time - p.t < 300);
}

function draw(timestamp) {
  if (state.paused) { requestAnimationFrame(draw); return; }

  state.time = timestamp;
  const pal = PALETTES[state.mode];

  // FPS
  frameCount++;
  if (timestamp - lastFpsUpdate > 500) {
    currentFps = Math.round(frameCount / ((timestamp - lastFpsUpdate) / 1000));
    frameCount = 0;
    lastFpsUpdate = timestamp;
    document.getElementById('fps').textContent = currentFps;
  }

  // Фон
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = `rgb(${pal.bg[0]},${pal.bg[1]},${pal.bg[2]})`;
  ctx.fillRect(0, 0, W, H);

  // Звёзды
  for (const star of stars) star.draw(ctx, timestamp);

  // Flow field
  flowField.update(timestamp);

  // Лента (от мыши)
  drawRibbon();
  ctx.drawImage(ribbonCanvas, 0, 0);

  // Потоки (stream particles)
  for (const p of streams) {
    p.update(flowField, pal);
    p.draw(ctx, pal, 0.85);
    if (p.dead) p.reset();
  }

  // Свечение вокруг курсора
  if (!mouse.down) {
    const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 90);
    g.addColorStop(0, `rgba(255,255,255,0.06)`);
    g.addColorStop(0.5, `rgba(255,255,255,0.02)`);
    g.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 90, 0, Math.PI*2);
    ctx.fill();
  }

  // Обновляем счётчики в UI раз в 30 кадров
  if (frameCount % 30 === 0) {
    document.getElementById('starCount').textContent = NUM_STARS;
    document.getElementById('streamCount').textContent = NUM_STREAMS;
  }

  requestAnimationFrame(draw);
}

// ─── Управление ───
function cycleMode() {
  state.mode = (state.mode + 1) % PALETTES.length;
  const btn = document.getElementById('btnMode');
  btn.textContent = PALETTES[state.mode].name;
  // Мигаем всеми кнопками
  btn.classList.add('active');
  setTimeout(() => btn.classList.remove('active'), 300);
}

function addBurst() {
  const count = 60;
  for (let i = 0; i < count; i++) {
    streams.push(new StreamParticle(true));
  }
  // Подрезаем если слишком много
  while (streams.length > 500) streams.shift();
}

function togglePause() {
  state.paused = !state.paused;
  const btn = document.getElementById('btnPause');
  btn.textContent = state.paused ? '▶ играть' : 'пауза';
  btn.classList.toggle('active', state.paused);
}

// Клавиатура
window.addEventListener('keydown', e => {
  switch(e.key.toLowerCase()) {
    case ' ': e.preventDefault(); addBurst(); break;
    case 'm': cycleMode(); break;
    case 'p': togglePause(); break;
    case 'f':
      // Полный экран
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.body.requestFullscreen().catch(()=>{});
      }
      break;
  }
});

// ─── Старт ───
document.getElementById('btnMode').textContent = PALETTES[0].name;
requestAnimationFrame(draw);

// Авто-скрытие статистики через 10 сек
setTimeout(() => {
  document.getElementById('stats').style.opacity = '0';
}, 10000);
</script>
</body>
</html>
