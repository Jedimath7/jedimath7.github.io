<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Звёздный сад • Star Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    overflow: hidden;
    font-family: 'Georgia', serif;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }
  #hint {
    position: fixed;
    bottom: 40px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 16px;
    pointer-events: none;
    transition: opacity 2s;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">двигай мышью • нажми и тяни • колёсико меняет цвет</div>

<script>
// ─── Звёздный сад — интерактивная частицовая симфония ───
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Мышь ───
const mouse = { x: W/2, y: H/2, down: false, px: W/2, py: H/2 };
window.addEventListener('mousemove', e => {
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = e.clientX; mouse.y = e.clientY;
});
window.addEventListener('mousedown', () => { mouse.down = true; hint.style.opacity = '0'; });
window.addEventListener('mouseup', () => { mouse.down = false; });
window.addEventListener('touchmove', e => {
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
  hint.style.opacity = '0';
}, {passive: true});
window.addEventListener('touchstart', () => { mouse.down = true; hint.style.opacity = '0'; });
window.addEventListener('touchend', () => { mouse.down = false; });

// ─── Цветовая палитра (HSL-сдвиг от колёсика) ───
let hueShift = 0;
window.addEventListener('wheel', e => {
  hueShift = (hueShift + e.deltaY * 0.3 + 360) % 360;
});

// ─── Частицы ───
class Particle {
  constructor(x, y) {
    this.reset(x, y);
  }
  reset(x, y) {
    this.x = x ?? Math.random() * W;
    this.y = y ?? Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.4;
    this.vy = (Math.random() - 0.5) * 0.4;
    this.life = 1;
    this.decay = 0.0015 + Math.random() * 0.004;
    this.size = 0.6 + Math.random() * 1.8;
    this.hue = (hueShift + Math.random() * 60 - 30 + 360) % 360;
    this.angle = Math.random() * Math.PI * 2;
    this.angleSpeed = (Math.random() - 0.5) * 0.02;
  }
  update() {
    // Притяжение к мыши
    const dx = mouse.x - this.x;
    const dy = mouse.y - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;

    if (mouse.down && dist < 250) {
      // Вихрь вокруг мыши при зажатии
      const force = 1.5 / (dist * 0.02 + 1);
      this.vx += (dx / dist) * force * 0.3;
      this.vy += (dy / dist) * force * 0.3;
      // Тангенциальная компонента — закрутка
      this.vx += (-dy / dist) * force * 0.15;
      this.vy += (dx / dist) * force * 0.15;
    } else {
      // Лёгкое притяжение к курсору
      const force = 0.3 / (dist * 0.03 + 1);
      this.vx += (dx / dist) * force * 0.12;
      this.vy += (dy / dist) * force * 0.12;
    }

    // Турбулентность (поле шума)
    this.angle += this.angleSpeed;
    const noiseScale = 0.015;
    const nx = Math.cos(this.x * noiseScale + this.angle * 0.3) * Math.sin(this.y * noiseScale * 1.3);
    const ny = Math.sin(this.y * noiseScale * 1.1 + this.angle * 0.2) * Math.cos(this.x * noiseScale * 0.9);
    this.vx += nx * 0.04;
    this.vy += ny * 0.04;

    // Трение
    this.vx *= 0.995;
    this.vy *= 0.995;

    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;

    // Возврат на сцену
    const margin = 60;
    if (this.x < -margin) this.x += W + margin*2;
    if (this.x > W + margin) this.x -= W + margin*2;
    if (this.y < -margin) this.y += H + margin*2;
    if (this.y > H + margin) this.y -= H + margin*2;
  }
  draw(ctx) {
    const alpha = this.life * 0.75;
    if (alpha < 0.01) return;
    const h = (this.hue + hueShift) % 360;
    // Свечение
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
    grad.addColorStop(0, `hsla(${h}, 80%, 70%, ${alpha})`);
    grad.addColorStop(0.4, `hsla(${h}, 70%, 55%, ${alpha * 0.5})`);
    grad.addColorStop(1, `hsla(${h}, 60%, 40%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  get dead() { return this.life <= 0; }
}

// ─── Создание частиц ───
const PARTICLES = 180;
const particles = [];
for (let i = 0; i < PARTICLES; i++) {
  particles.push(new Particle());
}

// ─── Фон: следы затухания для эффекта шлейфа ───
const trailCanvas = document.createElement('canvas');
const trailCtx = trailCanvas.getContext('2d');
trailCanvas.width = W;
trailCanvas.height = H;
window.addEventListener('resize', () => {
  trailCanvas.width = W;
  trailCanvas.height = H;
});

// ─── Анимация ───
function drawBackground() {
  // Полупрозрачный фон для шлейфа
  trailCtx.fillStyle = 'rgba(10, 10, 18, 0.12)';
  trailCtx.fillRect(0, 0, W, H);

  // Рисуем частицы на холсте шлейфа
  for (const p of particles) {
    if (!p.dead) p.draw(trailCtx);
  }

  // Переносим на основной холст
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(trailCanvas, 0, 0);

  // Поверх рисуем сами частицы (ярче)
  for (const p of particles) {
    if (!p.dead) {
      ctx.beginPath();
      const alpha = p.life;
      const h = (p.hue + hueShift) % 360;
      ctx.fillStyle = `hsla(${h}, 70%, 80%, ${alpha})`;
      ctx.arc(p.x, p.y, p.size * 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Если мышь зажата — рисуем кольцо
  if (mouse.down) {
    const h = (hueShift + 180) % 360;
    ctx.strokeStyle = `hsla(${h}, 70%, 70%, 0.5)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 40 + Math.sin(Date.now() * 0.005) * 15, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = `hsla(${hueShift}, 70%, 70%, 0.3)`;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 80 + Math.cos(Date.now() * 0.007) * 20, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function loop() {
  // Обновляем частицы
  for (const p of particles) {
    p.update();
    if (p.dead) p.reset();
  }

  drawBackground();
  requestAnimationFrame(loop);
}

// ─── Старт ───
loop();

// Скрываем подсказку через 12 секунд
setTimeout(() => { hint.style.opacity = '0'; }, 12000);
</script>
</body>
</html>
